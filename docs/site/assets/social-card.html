<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>M5.BloomFilter social card source (1200 x 630)</title>
<!-- Source of social-card.png. Render at 1200x630 with headless Chrome; see tools/SiteFilter/README.md. -->
<link rel="stylesheet" href="../style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; }
  .top { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 22px; }
  .top img { width: 150px; height: auto; }
  .top b { padding-left: 22px; border-left: 1px solid var(--off-edge); font: 600 30px/1 var(--condensed); }
  h1 { position: absolute; left: 64px; top: 128px; width: 590px; margin: 0; font-size: 82px; line-height: 0.97; text-wrap: wrap; }
  .probes { position: absolute; left: 64px; bottom: 56px; --cell: 56px; gap: 8px; }
  .bitfield { position: absolute; left: 698px; top: 88px; width: 446px; cursor: default; }
  .mark { animation: none; }
  .foot { position: absolute; left: 706px; bottom: 56px; width: 438px; font: 500 21px/1 var(--condensed); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); text-align: right; }
</style>
</head>
<body>
<div class="top"><img src="mill5-logo.png" alt="MILL5"><b>M5.BloomFilter</b></div>
<h1>This page knows <span class="figure">172,823</span> English words and stores none of them.</h1>
<ol class="probes" id="probes"></ol>
<div class="bitfield"><div class="bits"><canvas id="field-canvas"></canvas><div class="marks" id="marks"></div></div></div>
<p class="foot">A Bloom filter for .NET 10</p>
<script src="../bloom.js"></script>
<script src="../field.js"></script>
<script>
// Every bit of the real snapshot, and the seven that "bloom" points at.
fetch('../words.json').then(function (r) { return r.json(); }).then(function (snapshot) {
  var filter = Bloom.load(snapshot), grid = BitField.shape(filter, 1), style = getComputedStyle(document.documentElement);
  var canvas = document.getElementById('field-canvas'), size = Math.round(canvas.getBoundingClientRect().width);
  BitField.paint(filter, canvas, grid, size, size, style.getPropertyValue('--on'), style.getPropertyValue('--off'));

  var probe = filter.probe('bloom'), cells = document.getElementById('probes'), marks = document.getElementById('marks');
  probe.positions.forEach(function (position, index) {
    var item = document.createElement('li'); item.className = 'probe on';
    item.innerHTML = '<span class="cell' + (probe.set[index] ? ' on' : '') + '">' + (probe.set[index] ? 1 : 0) + '</span>';
    cells.appendChild(item);
    var mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = index + 1;
    mark.style.left = ((position % grid.cols) + 0.5) / grid.cols * 100 + '%';
    mark.style.top = (Math.floor(position / grid.cols) + 0.5) / grid.rows * 100 + '%';
    marks.appendChild(mark);
  });
  document.fonts.ready.then(function () { document.title = 'ready'; });
});
</script>
</body>
</html>
