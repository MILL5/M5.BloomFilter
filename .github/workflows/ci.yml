name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore and audit dependencies
        run: dotnet restore M5.BloomFilter.slnx -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Build
        run: dotnet build M5.BloomFilter.slnx -c ${{ matrix.configuration }} --no-restore
      - name: Test
        run: dotnet test M5.BloomFilter.slnx -c ${{ matrix.configuration }} --no-build --no-restore --blame-hang-timeout 60s
      - name: Verify release packages
        if: matrix.configuration == 'Release'
        run: dotnet pack M5.BloomFilter.slnx -c Release --no-build --no-restore -o artifacts/packages
